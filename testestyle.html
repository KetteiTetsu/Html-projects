<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina simples</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        color: #222;
        margin: 0;
        padding: 40px 20px;
      }

      .card {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        padding: 24px;
      }

      h1 {
        margin-top: 0;
        color: #2b4c7e;
      }

      .tag {
        display: inline-block;
        background: #dfeafe;
        color: #234a9a;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.8rem;
        font-weight: bold;
        margin-bottom: 12px;
      }

      ul {
        padding-left: 20px;
      }

      button {
        margin-top: 12px;
        background: #2b4c7e;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="tag">bemvindo!</span>
      <h1>Ola!</h1>
      <p>Este é uma pagina html de teste.</p>
      <ul>
        <li>Layout simples</li>
        <li>Estilo limpo</li>
      </ul>
      <button type="button">Clique em mim</button>
    </main>
  </body>
</html>
